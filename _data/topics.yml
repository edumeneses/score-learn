# The course as a knowledge base. Each topic groups the questions readers bring
# most often and links each one to the section that answers it. docs/topics.md
# renders this file, and each lesson's topic links under its title come from it.
#
# unit:   the unit number from units.yml that answers the question
# anchor: optional heading id on that page (kramdown GFM ids: lowercase, drop
#         punctuation, spaces to hyphens); omit it to link the whole page
# see:    optional inline list of further units, e.g. see: ["15", "P5"]
#
# scripts/check_lessons.py fails if a unit does not exist, if an anchor is not a
# heading on that page, or if a written unit is reachable from no topic. Keep
# the format flat: the checker reads it without PyYAML.

