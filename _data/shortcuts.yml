# Every keyboard shortcut and mouse gesture of ossia score 3.8.2 that the course
# knows of, rendered by docs/shortcuts.md as the Shortcut cheatsheet.
#
# keys:  alternatives separated by " / "; within one alternative, "+" joins keys
# mouse: a gesture, written as text, for items that have no key
# src:   where the entry was confirmed
#          menu    read from the 3.8.2 menus on 2026-09-28
#          lesson  used and checked in the lesson named in `see`
#          docs    upstream's shortcuts page only, not yet seen in the build
#
# On macOS, Qt shows Ctrl as the Command key.

